<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <style>
 /* ===== RESULT PAGE ===== */

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1d2671, #c33764);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.container {
    text-align: center;
    padding: 40px;
    width: 50%;
    border-radius: 15px;
    background: rgba(0,0,0,0.5);
    box-shadow: 0 0 30px black;
}

h1 {
    margin-bottom: 20px;
}

.attack {
    font-size: 28px;
    color: #00ffcc;
    margin-bottom: 15px;
}

.action {
    font-size: 18px;
    margin-bottom: 20px;
}

a {
    color: #00e6ff;
    text-decoration: none;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}

</style>
</head>
<body>
{% load static %}
<link rel="stylesheet" href="{% static 'css/result.css' %}">

<div class="container">

    <h1 class="title">Prediction Result</h1>

    <div class="attack">
        Attack Type: {{ attack }}
    </div>

    <a href="/responce/?attack={{ attack }}" class="btn">
        View Cause & Solution
    </a>

</div>

</body>
</html>
